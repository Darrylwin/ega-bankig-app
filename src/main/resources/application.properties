# ========================================
# CONFIGURATION DU SERVEUR
# ========================================
server.port=${PORT:8080}

# ========================================
# CONFIGURATION BASE DE DONNÉES
# ========================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ========================================
# CONFIGURATION JPA/HIBERNATE
# ========================================
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# ========================================
# CONFIGURATION JWT
# ========================================
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ========================================
# CONFIGURATION CORS
# ========================================
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# ========================================
# CONFIGURATION SWAGGER/OPENAPI
# ========================================
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.packages-to-scan=com.ega.banking.controller
springdoc.paths-to-match=/api/**

# ========================================
# CONFIGURATION DES LOGS
# ========================================
logging.level.com.ega.banking=${LOG_LEVEL:INFO}
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=${LOG_LEVEL_SQL:WARN}