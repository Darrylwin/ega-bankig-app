<div class="accounts-container">
  <!-- En-tête -->
  <div class="accounts-header mb-4">
    <div class="row align-items-center">
      <div class="col-md-8">
        <h2>Gestion des Comptes</h2>
        <p class="text-muted mb-0">
          Gérez les comptes bancaires de vos clients
        </p>
      </div>
      <div class="col-md-4 text-end">
        <button nbButton status="primary" (click)="onCreate()">
          <nb-icon icon="plus-circle-outline" class="me-2"></nb-icon>
          Nouveau Compte
        </button>
      </div>
    </div>
  </div>

  <!-- Filtres -->
  <nb-card class="mb-4">
    <nb-card-body>
      <div class="row">
        <div class="col-md-4 mb-3">
          <label class="form-label">Recherche</label>
          <div class="input-group">
            <input
              type="text"
              nbInput
              fullWidth
              placeholder="IBAN ou nom client..."
              [(ngModel)]="searchTerm"
              (keyup.enter)="applyFilters()"
            />
            <button nbButton ghost (click)="applyFilters()">
              <nb-icon icon="search-outline"></nb-icon>
            </button>
          </div>
        </div>

        <div class="col-md-3 mb-3">
          <label class="form-label">Type de compte</label>
          <nb-select
            fullWidth
            [(ngModel)]="accountTypeFilter"
            (ngModelChange)="applyFilters()"
          >
            <nb-option
              *ngFor="let type of filterOptions.accountTypes"
              [value]="type.value"
            >
              {{ type.label }}
            </nb-option>
          </nb-select>
        </div>

        <div class="col-md-3 mb-3">
          <label class="form-label">Statut</label>
          <nb-select
            fullWidth
            [(ngModel)]="statusFilter"
            (ngModelChange)="applyFilters()"
          >
            <nb-option
              *ngFor="let status of filterOptions.statuses"
              [value]="status.value"
            >
              {{ status.label }}
            </nb-option>
          </nb-select>
        </div>

        <div class="col-md-2 mb-3 d-flex align-items-end">
          <button nbButton status="basic" fullWidth (click)="resetFilters()">
            <nb-icon icon="refresh-outline" class="me-2"></nb-icon>
            Réinitialiser
          </button>
        </div>
      </div>
    </nb-card-body>
  </nb-card>

  <!-- Indicateur de chargement -->
  <div *ngIf="isLoading" class="text-center py-5">
    <nb-spinner size="giant" status="primary"></nb-spinner>
    <p class="mt-3">Chargement des comptes...</p>
  </div>

  <!-- Tableau des comptes -->
  <div *ngIf="!isLoading">
    <nb-card>
      <nb-card-header class="d-flex justify-content-between align-items-center">
        <div>
          <h5 class="mb-0">Liste des Comptes</h5>
          <small class="text-muted">{{ totalItems }} compte(s) trouvé(s)</small>
        </div>
        <div>
          <button nbButton status="info" size="small" (click)="exportToCSV()">
            <nb-icon icon="download-outline" class="me-2"></nb-icon>
            Exporter CSV
          </button>
        </div>
      </nb-card-header>

      <nb-card-body>
        <div class="table-responsive">
          <ng2-smart-table
            [settings]="settings"
            [source]="source"
            (create)="onCreate()"
            (edit)="onView($event)"
            (delete)="onDelete($event)"
          >
          </ng2-smart-table>
        </div>
      </nb-card-body>

      <!-- Pagination -->
      <nb-card-footer class="d-flex justify-content-between align-items-center">
        <div>
          <span class="text-muted">
            Page {{ currentPageDisplay }} sur {{ totalPages }}
          </span>
        </div>
        <div>
          <button
            nbButton
            size="small"
            ghost
            [disabled]="currentPage === 0"
            (click)="goToFirstPage()"
          >
            <nb-icon icon="skip-back-outline"></nb-icon>
          </button>
          <button
            nbButton
            size="small"
            ghost
            [disabled]="currentPage === 0"
            (click)="goToPreviousPage()"
          >
            <nb-icon icon="chevron-left-outline"></nb-icon>
          </button>
          <button
            nbButton
            size="small"
            ghost
            [disabled]="currentPage >= totalPages - 1"
            (click)="goToNextPage()"
          >
            <nb-icon icon="chevron-right-outline"></nb-icon>
          </button>
          <button
            nbButton
            size="small"
            ghost
            [disabled]="currentPage >= totalPages - 1"
            (click)="goToLastPage()"
          >
            <nb-icon icon="skip-forward-outline"></nb-icon>
          </button>
        </div>
      </nb-card-footer>
    </nb-card>
  </div>

  <!-- Aucune donnée -->
  <div *ngIf="!isLoading && accounts.length === 0" class="text-center py-5">
    <nb-icon
      icon="credit-card-outline"
      size="giant"
      class="text-muted mb-3"
    ></nb-icon>
    <h4>Aucun compte trouvé</h4>
    <p class="text-muted mb-4">Commencez par créer un nouveau compte</p>
    <button nbButton status="primary" size="large" (click)="onCreate()">
      <nb-icon icon="plus-circle-outline" class="me-2"></nb-icon>
      Créer un compte
    </button>
  </div>
</div>
