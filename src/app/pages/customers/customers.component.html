<div class="customers-container">
  <!-- En-tête -->
  <div class="customers-header mb-4">
    <div class="row align-items-center">
      <div class="col-md-6">
        <h2>Gestion des Clients</h2>
        <p class="text-muted mb-0">Gérez vos clients bancaires</p>
      </div>
      <div class="col-md-6 text-end">
        <div class="d-flex justify-content-end align-items-center gap-2">
          <!-- Recherche -->
          <div class="search-box">
            <div class="input-group">
              <input
                type="text"
                nbInput
                fullWidth
                placeholder="Rechercher un client..."
                [(ngModel)]="searchTerm"
                (keyup.enter)="onSearch()"
              />
              <button
                nbButton
                ghost
                size="small"
                (click)="onSearch()"
                [disabled]="!searchTerm"
              >
                <nb-icon icon="search-outline"></nb-icon>
              </button>
              <button
                nbButton
                ghost
                size="small"
                *ngIf="searchTerm"
                (click)="clearSearch()"
              >
                <nb-icon icon="close-outline"></nb-icon>
              </button>
            </div>
          </div>

          <!-- Actions -->
          <button nbButton status="primary" (click)="onCreate()">
            <nb-icon icon="person-add-outline" class="me-2"></nb-icon>
            Nouveau Client
          </button>

          <button nbButton status="info" (click)="exportToCSV()">
            <nb-icon icon="download-outline" class="me-2"></nb-icon>
            Exporter
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Indicateur de chargement -->
  <div *ngIf="isLoading" class="text-center py-5">
    <nb-spinner size="giant" status="primary"></nb-spinner>
    <p class="mt-3">Chargement des clients...</p>
  </div>

  <!-- Tableau des clients -->
  <div *ngIf="!isLoading">
    <nb-card>
      <nb-card-body>
        <div class="table-responsive">
          <ng2-smart-table
            [settings]="settings"
            [source]="source"
            (create)="onCreate()"
            (edit)="onEdit($event)"
            (delete)="onDelete($event)"
            (userRowSelect)="onView($event)"
          >
          </ng2-smart-table>
        </div>
      </nb-card-body>

      <!-- Infos pagination -->
      <nb-card-footer class="d-flex justify-content-between align-items-center">
        <div>
          <span class="text-muted">
            {{ totalItems }} client{{ totalItems > 1 ? "s" : "" }} au total
          </span>
        </div>
        <div>
          <span class="text-muted me-3">
            Page {{ currentPageDisplay }} sur {{ totalPages }}
          </span>
          <button
            nbButton
            size="small"
            ghost
            [disabled]="currentPage === 0"
            (click)="goToFirstPage()"
          >
            <nb-icon icon="skip-back-outline"></nb-icon>
          </button>
          <button
            nbButton
            size="small"
            ghost
            [disabled]="currentPage === 0"
            (click)="goToPreviousPage()"
          >
            <nb-icon icon="chevron-left-outline"></nb-icon>
          </button>
          <button
            nbButton
            size="small"
            ghost
            [disabled]="currentPage >= totalPages - 1"
            (click)="goToNextPage()"
          >
            <nb-icon icon="chevron-right-outline"></nb-icon>
          </button>
          <button
            nbButton
            size="small"
            ghost
            [disabled]="currentPage >= totalPages - 1"
            (click)="goToLastPage()"
          >
            <nb-icon icon="skip-forward-outline"></nb-icon>
          </button>
        </div>
      </nb-card-footer>
    </nb-card>
  </div>

  <!-- Aucune donnée -->
  <div *ngIf="!isLoading && customers.length === 0" class="text-center py-5">
    <nb-icon
      icon="people-outline"
      size="giant"
      class="text-muted mb-3"
    ></nb-icon>
    <h4>Aucun client trouvé</h4>
    <p class="text-muted mb-4">Commencez par ajouter votre premier client</p>
    <button nbButton status="primary" size="large" (click)="onCreate()">
      <nb-icon icon="person-add-outline" class="me-2"></nb-icon>
      Ajouter un client
    </button>
  </div>
</div>
